name: Ask a question
description: Ask about using Gloss Browser.
title: "Question: "
labels: [question, triage]
body:
  - type: markdown
    attributes:
      value: "For feature requests, use [Ideas Discussions](https://github.com/glossbrowser/feedback/discussions/categories/ideas). For security concerns, use [private vulnerability reporting](https://github.com/glossbrowser/feedback/security/advisories/new). Please leave out private information."
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do, and where did you get stuck?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Gloss Browser version, if relevant
    validations:
      required: false
