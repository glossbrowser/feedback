name: Report a bug
description: Tell us about something that is broken in Glossium.
title: "Bug: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: "For feature requests, use [Ideas Discussions](https://github.com/glossium/feedback/discussions/categories/ideas). For security concerns, use [private vulnerability reporting](https://github.com/glossium/feedback/security/advisories/new). Remove private information from your report."
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do before the problem happened?
      placeholder: "1. Open…\n2. Choose…\n3. See…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Glossium version
      description: From Glossium › About Glossium.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
